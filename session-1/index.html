{sec:"SESSION 1 · OPEN", title:`AI FOUNDATIONS: HOW AI <span class="g">REALLY</span> WORKS`, center:true,

{sec:"SESSION 1 · OPEN", title:`THE COURSE IN <span class="g">ONE LINE</span>`,
 body:`<div class="arc" style="justify-content:center"><span class="st">How AI works</span><span class="ar">→</span><span class="st">Your workspace</span><span class="ar">→</span><span class="st">Discovery</span><span class="ar">→</span><span class="st">Data</span><span class="ar">→</span><span class="st">Agents</span><span class="ar">→</span><span class="st">Automation</span><span class="ar">→</span><span class="st">Build</span><span class="ar">→</span><span class="st final">Ship live</span></div>
   <div class="cap" style="text-align:center;max-width:820px;margin-left:auto;margin-right:auto">8 sessions. Each one ends with a thing you made. You finish with <b style="color:var(--accent)">your own skills and agents</b> and <b style="color:var(--accent)">a live product</b> at a public link.</div>`},

   <img src="../assets/img/tigran-2026.jpg" alt="Tigran Sargsyan" style="width:220px;height:220px;object-fit:cover;border-radius:16px;border:2px solid var(--accent)">

   <li>5+ years running product and marketing <b style="color:var(--accent)">AI ops at Picsart (~150M users)</b></li>

   <li>A PM, <b>not an engineer</b>. All of it by directing AI.</li></ul></div>`},

{sec:"SESSION 1 · OPEN", title:`HOW WE <span class="g">RUN TONIGHT</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">~90 min</span><span class="arw">→</span><span class="b">how AI works, where it came from, where it fails, where it is heading, how to ask</span></div>
   <div class="row"><span class="a">~20 min</span><span class="arw">→</span><span class="b">two short tries in the Claude chat, <b>no install</b></span></div>
   <div class="row"><span class="a">~10 min</span><span class="arw">→</span><span class="b">share, then homework for Session 2</span></div></div>
   <div class="cap" style="max-width:820px;margin:14px auto 0">Questions in the chat any time. Long or personal questions go to DM, so the group keeps moving.</div>`},

{sec:"WHY NOW", center:true, title:`WHY <span class="g">NOW</span>`,
 body:`<div class="num">3</div><div class="cap" style="max-width:760px;margin-left:auto;margin-right:auto">Years for AI to reach about half of people. The internet took about 7. The PC took about 15.</div><div class="src"><b>Source:</b> CCIA / Stanford AI Index 2026</div>`},

{module:'world-dots', scope:'lite'},

{sec:"WHY NOW", title:`AND IT ALREADY <span class="g">WORKS</span>`,
 body:`<div class="sub" style="margin-top:0">758 BCG consultants. Real consulting tasks. Half got AI, half did not.</div>
   <div class="bcg">
     <div class="pan in"><div class="ph">Task AI is good at</div>
       <div class="kp"><b>+12%</b><span>more tasks done</span></div>
       <div class="kp"><b>+25%</b><span>faster</span></div>
       <div class="kp big"><b>+40%</b><span>higher quality</span></div></div>
     <div class="pan out"><div class="ph">Task just outside its skill</div>
       <div class="kp big"><b>−19</b><span>points less likely to get the right answer</span></div>
       <div class="pc">The AI sounded sure. People trusted it, and got it wrong.</div></div>
     <div class="pan lift"><div class="ph">Who gains most</div>
       <div class="hb"><span>Weaker performers</span><i style="width:100%"></i><b>+43%</b></div>
       <div class="hb"><span>Stronger performers</span><i style="width:40%"></i><b>+17%</b></div>
       <div class="pc">AI lifts the floor more than the ceiling.</div></div></div>
   <div class="cap" style="max-width:900px;margin:12px auto 0">Same people, same AI. The result depends on <b style="color:var(--fg)">which side of the edge</b> the task sits.</div>
   <div class="src"><b>Source:</b> Dell'Acqua et al., "Navigating the Jagged Technological Frontier", Harvard Business School and BCG, 2023</div>`},

{sec:"WHY NOW", center:true, title:`ONE IDEA FOR THE <span class="g">WHOLE COURSE</span>`,
 body:`<div class="sub" style="font-size:clamp(22px,2.8vw,36px);color:var(--fg)">AI amplifies <span class="g">who you are.</span></div>
   <div class="sub">A sharp thinker gets sharper. A sloppy one just gets louder. It multiplies your thinking. It does not replace it.</div>`},

{sec:"WHERE ARE YOU", title:`QUICK CHECK: <span class="g">WHERE ARE YOU?</span>`,
 body:`<div class="sub" style="margin-top:0">Type three numbers in the chat, for example <b style="color:var(--fg)">2 · 1 · 3</b></div>
   <div class="cards" style="grid-template-columns:repeat(3,1fr);margin-top:14px">
   <div class="card"><div class="tag" style="color:var(--accent)">A · AI level</div><p>1 I chat with AI sometimes<br>2 I use it daily for work<br>3 I build with it</p></div>
   <div class="card"><div class="tag" style="color:var(--accent)">B · Role</div><p>1 PM, PO or BA<br>2 Project or program manager<br>3 Founder<br>4 Other tech role</p></div>
   <div class="card"><div class="tag" style="color:var(--accent)">C · Paid Claude?</div><p>1 Yes, Pro or Max<br>2 Free plan only<br>3 No account yet</p></div></div>
   <div class="cap" style="max-width:820px;margin:14px auto 0">I use this to set the pace for tonight.</div>`},

{sec:"A SHORT HISTORY", title:`NOBODY CAN <span class="g">DEFINE IT</span>`,
 body:`<div class="sub" style="color:var(--fg)">There is still <span class="g">no strict definition</span> of AI.</div>
   <div class="cap" style="max-width:840px;margin:6px auto 18px">We have no strict definition of <b style="color:var(--fg)">human intelligence</b> either. Nobody can fully define thinking or understanding. So "artificial" intelligence has the same blur.</div>
   <div class="defbox"><div class="k">THE WORKING DEFINITION</div>
     <div class="t">A machine that does something we would call <b style="color:var(--accent)">intelligent</b> if a person did it.</div></div>
   <div class="src"><b>The AI effect:</b> once it works, we stop calling it AI. Chess, spam filters, autocomplete and face unlock are all "just software" now.</div>`},

     <g fill="var(--accent)" stroke="var(--bg)" stroke-width="2">

     <g fill="var(--risk)" stroke="var(--bg)" stroke-width="2"><circle cx="342" cy="240" r="6"/><circle cx="495" cy="245" r="6"/></g>
     <g font-family="Barlow" font-weight="700" font-size="14" fill="var(--accent)" text-anchor="middle">
       <text x="60" y="195" text-anchor="start">1950 Turing</text>
       <text x="130" y="96">1956 named</text>
       <text x="412" y="114">1980s expert systems</text>
       <text x="787" y="140">2012 deep learning</text>
       <text x="846" y="78">2017 transformers</text></g>
     <text x="905" y="38" font-family="Barlow" font-weight="900" font-size="16" fill="var(--fg)" text-anchor="end">2022 ChatGPT</text>
     <g font-family="Barlow" font-weight="800" font-size="13" fill="var(--risk)" text-anchor="middle" letter-spacing="1">

{sec:"A SHORT HISTORY", title:`CHESS, <span class="g">THEN GO</span>`,
 body:`<div class="boards">
     <div><div class="bd chess"></div><div class="nm">CHESS</div><div class="cap" style="margin-top:2px">1997 · Deep Blue beats Kasparov</div></div>
     <div><div class="bd go"><i style="left:43px;top:43px"></i><i class="a" style="left:68px;top:68px"></i><i style="left:93px;top:43px"></i></div><div class="nm">GO</div><div class="cap" style="margin-top:2px">2016 · AlphaGo beats Lee Sedol 4-1</div></div></div>
   <div class="cap" style="max-width:840px;margin:0 auto">Go has more possible positions than there are atoms in the universe. Experts said a machine win was decades away. Then it happened. The lesson: AI can be <b style="color:var(--fg)">superhuman at one task and lost at the next.</b> We come back to this uneven skill soon.</div>`},

{sec:"WHAT AI REALLY IS", title:`HOW DID IT <span class="g">LEARN?</span>`,
 body:`<div class="rows">
     <div class="row"><span class="a">1 · Pre-training</span><span class="arw">→</span><span class="b">Reads a huge amount of web pages, books and code. Learns the patterns of language.</span></div>
     <div class="row"><span class="a">2 · Human feedback</span><span class="arw">→</span><span class="b">People rank its answers. It learns to be helpful, and to please.</span></div></div>
   <div class="cap" style="max-width:820px;margin:14px auto 0">This is why it is fluent, why it carries human bias, and why it tends to agree with you.</div>`},

/* ───────── WHERE IT BREAKS ───────── */
{sec:"WHERE IT BREAKS", title:`WHERE IT <span class="w">BREAKS</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div><div class="sub">Learn how it fails, so you catch it.</div>`},

{module:'hallucination-map', scope:'lite'},

{sec:"WHERE IT BREAKS · task", center:true, title:`TRY IT: <span class="g">CATCH ONE</span>`,
 body:`<span class="turn">Your turn · 5 min</span>
   <div class="mono" style="max-width:740px;margin:12px auto 0;text-align:left">In claude.ai (free is fine), ask:<br><span class="c">"Give me 3 sources on [a niche topic from your work], with links."</span><br>Open each link. Does it exist? Does it say what Claude said?</div>
   <div class="cap" style="max-width:760px;margin:12px auto 0">A hallucination is a confident answer that is false. The habit: for any fact, number or quote, check it or do not ship it.</div>`},

{module:'jagged-frontier', scope:'lite'},

{module:'moravec', scope:'lite'},

{sec:"WHERE IT BREAKS", title:`TWO MORE <span class="w">TRAPS</span>`,
 body:`<div class="rows">
   <div class="row"><span class="a">Out of date</span><span class="arw">→</span><span class="b">It learned up to a <b>training cutoff</b> date. Ask for "the latest" and you may get last year, unless it can search the web.</span></div>
   <div class="row"><span class="a">Eager to agree</span><span class="arw">→</span><span class="b">It mirrors its data and your prompt. A leading question gets a yes, in <b>fluent</b> prose.</span></div></div>
   <div class="cap" style="max-width:820px;margin:14px auto 0">The danger is not that it is wrong. It is that it is wrong <b>and sounds sure.</b></div>`},

{module:'bias-mirror', scope:'lite'},

{sec:"WHERE IT BREAKS", title:`THIS IS WHY <span class="g">YOU MATTER</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="font-size:clamp(20px,2.4vw,30px);color:var(--fg)">Every blind spot needs a human with judgment.</div>
   <div class="sub">AI does the volume. You give the verdict.</div>`},

{sec:"BREAK", title:`<span class="g">BREAK</span> · 8 MIN`, center:true,
 body:`<div class="num small">8</div><div class="cap">Back in about 8 minutes.</div>`},

       <div class="keys"><span>7</span><span>8</span><span>9</span><span class="op">÷</span><span>4</span><span>5</span><span>6</span><span class="op">×</span><span>1</span><span>2</span><span>3</span><span class="op">−</span><span>0</span><span>.</span><span class="op">+</span><span class="eq">=</span></div></div>

{sec:"AGENTS + SAFETY", title:`YOUR DATA <span class="w">RED-LINES</span>`,
 body:`<div class="cards">
   <div class="card"><div class="tag" style="color:var(--risk)">Never paste into a public AI</div><p>Customer account, card or transaction data<br>KYC files and personal IDs<br>Internal risk, credit or pricing models<br>Passwords and API keys (secret keys that open a system)</p></div>
   <div class="card good"><div class="tag">Safe by default</div><p>Remove names and numbers before you paste<br>Use your company's enterprise AI for work data<br>Keep personal tests apart from real work data</p></div></div>`},

/* ───────── PROMPTING ───────── */
{sec:"PROMPTING · R·C·T·C", title:`PROMPTING IS <span class="g">THE SKILL</span>`, center:true,
 body:`<div class="rule" style="margin-left:auto;margin-right:auto"></div>
   <div class="sub" style="font-size:clamp(20px,2.4vw,30px);color:var(--fg)">The model is not what changes. <span class="g">Your prompt is.</span></div>`},

{sec:"PROMPTING · R·C·T·C", title:`THE <span class="g">R·C·T·C</span> PROMPT`,
 body:`<div class="sub" style="margin-top:0">Everyone here has the same Claude. The difference is <span class="g">the prompt.</span></div>
   <div class="blocks" style="margin-top:14px">
   <div class="block"><div class="bl">R · Role</div><p>Who the AI should be.<br><span style="color:var(--muted)">"You are a senior B2B product manager."</span></p></div>
   <div class="block"><div class="bl">C · Context</div><p>What it cannot know: situation, limits, audience, your docs.</p></div>
   <div class="block"><div class="bl">T · Task</div><p>One ask and the exact output shape.<br><span style="color:var(--muted)">"5 bullets, under 120 words."</span></p></div>
   <div class="block"><div class="bl">C · Critique</div><p>Make it check its own work.<br><span style="color:var(--muted)">"List 3 weak points first."</span></p></div></div>`},

{sec:"PROMPTING · R·C·T·C", title:`LAZY <span class="g">VS</span> R·C·T·C`,
 body:`<div class="cards">
   <div class="card bad"><div class="tag">Lazy</div><p>"write a product update."</p></div>
   <div class="card good"><div class="tag">R·C·T·C</div><p>"You are a senior PM <span class="g">(R)</span>. We shipped X to business users. The audience is the exec team. Tone: confident but honest <span class="g">(C)</span>. Write 5 bullets, under 120 words, with one risk <span class="g">(T)</span>. Then list anything vague or not checked <span class="g">(C)</span>."</p></div></div>
`},

{sec:"PROMPTING · R·C·T·C", title:`ITERATION + THE <span class="g">5-50 RULE</span>`,
 body:`<div class="sub">The first answer is a <b style="color:var(--fg)">draft,</b> not the final work. Steer it with specific edits. Do not restart.</div>
   <div class="bignum-wrap" style="justify-content:center">
   <div><div class="num small">5</div><div class="barlabel" style="text-align:left">min on Role + Context</div></div>
   <div style="color:var(--muted);font-family:var(--h);font-weight:800;font-size:38px">saves</div>
   <div><div class="num small">50</div><div class="barlabel" style="text-align:left">min of rework</div></div></div>`},

/* ───────── HANDS-ON ───────── */
{sec:"TRY IT", title:`TRY IT: YOUR FIRST <span class="g">R·C·T·C PROMPT</span>`,
 body:`<span class="turn">Your turn · 15 min</span>
   <div class="mono"><ol class="steps2">
   <li>Pick a <span class="c">real task you do every week</span>: a status update, meeting notes to actions, a stakeholder email.</li>
   <li>Write it as <span class="c">R·C·T·C</span>, all four parts. Remove names and numbers first.</li>
   <li>Run it. Then improve it once with one specific edit.</li>
   <li><span class="c">Save the good version</span> in a note. In Session 2 it becomes your first skill.</li></ol></div>`},

{sec:"SHARE", title:`QUICK <span class="g">ROUND</span>`, center:true,
 body:`<div class="sub" style="font-size:clamp(20px,2.4vw,30px);color:var(--fg)">Share one: the idea that surprised you most tonight, and one task you hand to AI this week.</div>`},

/* ───────── CLOSE ───────── */
{sec:"RECAP + HOMEWORK", title:`THE THREE THAT <span class="g">MATTER</span>`, center:true,
 body:`<div style="max-width:680px;margin:0 auto;text-align:left"><ul class="recaplist">
   <li><span class="n">1</span><span>It predicts plausible text. So you check facts.</span></li>
   <li><span class="n">2</span><span>Its skill is uneven. So you learn where the edge is.</span></li>
   <li><span class="n">3</span><span>AI amplifies who you are. So you bring judgment.</span></li></ul></div>`},

{sec:"RECAP + HOMEWORK", title:`START YOUR <span class="g">PRODUCT IDEA</span>`, center:true,
 body:`<div class="num" style="font-size:clamp(72px,16vw,200px)">SHIP</div>
   <div class="cap">In Sessions 7 and 8 you build and ship one small product that solves one real problem. Start a list now.<br><br>Starters: an idea scorer, an assistant over your own docs, a small status dashboard, a "draft my update" tool.</div>`},

{sec:"BEFORE SESSION 2 · homework", title:`BEFORE <span class="g">SESSION 2</span>: 4 STEPS`,
 body:`<div class="hw">
   <div class="s w"><b>1 · Buy Claude Pro or Max</b><span>At <span class="c">claude.com/pricing</span>. The free plan has <strong style="color:var(--fg)">no Claude Code.</strong> Pro is the cheapest plan that works.</span></div>
   <div class="s"><b>2 · Install the desktop app</b><span>From <span class="c">claude.com/download</span>. Mac (macOS 13 or newer) or Windows 10 or newer.</span></div>
   <div class="s"><b>3 · Sign in</b><span>Open the app. Sign in with the same account you paid with.</span></div>
   <div class="s"><b>4 · Open the Code tab once</b><span>Click <span class="c">Code</span> at the top of the sidebar. No upgrade prompt? You are ready.</span></div></div>
   <div class="cap" style="max-width:860px;margin:14px auto 0">Claude Code is the part of Claude that works on real files in a folder on your laptop. The app includes it. <b>No terminal, no code editor, nothing else to install.</b></div>`},

{sec:"BEFORE SESSION 2 · homework", title:`ALSO, IF YOU <span class="g">HAVE TIME</span>`,
 body:`<ul class="checklist" style="max-width:820px;margin:0 auto;text-align:left">
   <li>Run your R·C·T·C prompt on one real task this week.</li>
   <li>Write down 2 product ideas.</li></ul>
   <div class="cap" style="max-width:780px;margin:16px auto 0;text-align:center">Optional. The 4 setup steps are the only must.</div>`},

   <div class="sub" style="color:var(--accent);font-weight:800;margin-top:12px">Come with the Code tab already open. That is the one thing.</div>
